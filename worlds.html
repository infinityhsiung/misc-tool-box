<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta id="map-theme" name="theme-color" content="#f6f7f3">
  <meta name="description" content="上海地圖的表世界與李世界。">
  <title>表世界 / 李世界 · Everyday Toolkit</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="toolkit.css">
  <link rel="stylesheet" href="worlds.css">
  <script src="vendor/leaflet/leaflet.js" defer></script>
  <script src="worlds.js" defer></script>
</head>
<body>
  <main class="shell map-page" id="world-page" data-world="surface">
    <header class="topbar">
      <nav class="page-nav"><a href="index.html" lang="en">← Home</a></nav>
      <h1 id="world-name" aria-live="polite">表世界</h1>
      <button class="world-toggle" id="world-toggle" type="button" aria-controls="shanghai-map" disabled>切換到李世界</button>
    </header>
    <div class="map-frame">
      <div id="shanghai-map" aria-label="上海地圖 · 表世界"></div>
      <div class="map-notice" id="map-notice" role="status">
        <span id="map-status">地圖加載中…</span>
        <button id="map-retry" type="button" hidden>重試</button>
      </div>
    </div>
    <noscript><p>請啟用 JavaScript 以查看地圖。</p></noscript>
  </main>
</body>
</html>
